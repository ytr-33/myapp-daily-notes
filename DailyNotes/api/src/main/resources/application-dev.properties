# H2 Database Configuration (Development Only)
# 警告:  この設定は開発環境専用です。
# 本番環境やインターネットに公開される環境では絶対に使用しないでください。
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# 安全性を高める場合はパスワードを環境変数 H2_DB_PASSWORD で設定してください。
# spring.datasource.password=${H2_DB_PASSWORD:change-me-dev-only}

# Logging (Development)
logging.level.com.example.api=DEBUG
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
